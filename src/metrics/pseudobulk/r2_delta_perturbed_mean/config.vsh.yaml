__merge__: ../../../api/comp_condition_centroid_metric.yaml
name: r2_delta_perturbed_mean
info:
  metrics:
    - name: r2_delta_perturbed_mean
      label: R2 delta perturbed mean
      summary: R-squared relative to the training-perturbation mean.
      description: >-
        Computes R-squared after predicted and observed profiles are centered
        on the equal-condition-weighted training-perturbation mean in their
        covariate group.
      references:
        doi: 10.1101/2025.10.20.683304
      links:
        repository: https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines
      min: -.inf
      max: 1
      maximize: true
resources:
  - type: python_script
    path: script.py
  - path: ../_shared/condition_centroid_metric_runner.py
  - path: ../_shared/condition_centroid_metrics.py
test_resources:
  - type: python_script
    path: /common/component_tests/check_config.py
  - type: python_script
    path: ../_shared/test_condition_centroid_component.py
engines:
  - type: docker
    image: openproblems/base_python:1.0.0
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, highmem, highcpu]
