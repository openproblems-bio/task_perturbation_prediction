__merge__: ../../../api/comp_condition_centroid_metric.yaml
name: normalized_inverse_rank
info:
  metrics:
    - name: normalized_inverse_rank
      label: Normalized inverse rank
      summary: Fraction of unmatched truths farther from a prediction than its match.
      description: >-
        Within each covariate group, measures the fraction of unmatched observed
        centroids whose Euclidean distance from a prediction is larger than the
        distance to its matched observed centroid. Ties are failures.
      references:
        doi: 10.1101/2025.10.20.683304
      links:
        repository: https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines
      min: 0
      max: 1
      maximize: true
resources:
  - type: python_script
    path: script.py
  - path: ../_shared/condition_centroid_metric_runner.py
  - path: ../_shared/condition_centroid_metrics.py
test_resources:
  - type: python_script
    path: /common/component_tests/check_config.py
  - type: python_script
    path: ../_shared/test_condition_centroid_component.py
engines:
  - type: docker
    image: openproblems/base_python:1.0.0
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, highmem, highcpu]
