__merge__: ../../../api/comp_condition_centroid_metric.yaml
name: pearson_delta_control
info:
  metrics:
    - name: pearson_delta_control
      label: Pearson delta control
      summary: Pearson correlation of control-referenced perturbation effects.
      description: >-
        Subtracts the same matched control centroid from the predicted and
        observed condition centroids and computes Pearson correlation across
        all genes for each perturbation.
      references:
        doi: 10.1101/2025.10.20.683304
      links:
        repository: https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines
      min: -1
      max: 1
      maximize: true
resources:
  - type: python_script
    path: script.py
  - path: ../_shared/condition_centroid_metric_runner.py
  - path: ../_shared/condition_centroid_metrics.py
test_resources:
  - type: python_script
    path: /common/component_tests/check_config.py
  - type: python_script
    path: ../_shared/test_condition_centroid_component.py
engines:
  - type: docker
    image: openproblems/base_python:1.0.0
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, highmem, highcpu]
