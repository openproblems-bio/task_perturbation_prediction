__merge__: ../../../api/comp_condition_centroid_metric.yaml
name: r2_delta_control
info:
  metrics:
    - name: r2_delta_control
      label: R2 delta control
      summary: R-squared of control-referenced perturbation effects.
      description: >-
        Computes the coefficient of determination between predicted and
        observed control-referenced gene-expression effects for each condition.
      references:
        doi: 10.1101/2025.10.20.683304
      links:
        repository: https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines
      min: -.inf
      max: 1
      maximize: true
resources:
  - type: python_script
    path: script.py
  - path: ../_shared/condition_centroid_metric_runner.py
  - path: ../_shared/condition_centroid_metrics.py
test_resources:
  - type: python_script
    path: /common/component_tests/check_config.py
  - type: python_script
    path: ../_shared/test_condition_centroid_component.py
engines:
  - type: docker
    image: openproblems/base_python:1.0.0
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, highmem, highcpu]
